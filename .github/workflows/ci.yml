name: cross-platform-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Lint Python
        run: python -m ruff check .
      - name: Check Python formatting
        run: python -m ruff format --check .
      - name: Compile Python
        run: python -m compileall -q bidpilot tests tools bootstrap.py
      - name: Check browser JavaScript
        run: node --check bidpilot/static/app.js
      - name: Validate structured configuration
        run: python tools/validate_release.py
      - name: Run tests
        run: python -m pytest

  container:
    name: ubuntu container / Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Build Linux runtime image
        run: docker build --tag bidpilot:ci .
