x-bidpilot-environment: &bidpilot-environment
  BIDPILOT_ENV: production
  BIDPILOT_TIMEZONE: ${BIDPILOT_TIMEZONE:-Asia/Shanghai}
  BIDPILOT_DATA_DIR: /app/data
  BIDPILOT_CONTROL_DIR: /app/data
  BIDPILOT_DATABASE_PATH: /app/data/bidpilot.db
  BIDPILOT_REPORT_DIR: /app/outputs/reports
  BIDPILOT_WORKER_POLL_INTERVAL: ${BIDPILOT_WORKER_POLL_INTERVAL:-3}
  BIDPILOT_WORKER_LEASE_SECONDS: ${BIDPILOT_WORKER_LEASE_SECONDS:-900}
  BIDPILOT_WORKER_HEARTBEAT_TTL: ${BIDPILOT_WORKER_HEARTBEAT_TTL:-30}
  BIDPILOT_REQUEST_TIMEOUT: ${BIDPILOT_REQUEST_TIMEOUT:-20}
  BIDPILOT_REQUEST_INTERVAL: ${BIDPILOT_REQUEST_INTERVAL:-0.8}
  BIDPILOT_MAX_RESULTS_PER_SOURCE: ${BIDPILOT_MAX_RESULTS_PER_SOURCE:-20}
  BIDPILOT_CCGP_MAX_PAGES: ${BIDPILOT_CCGP_MAX_PAGES:-2}
  BIDPILOT_QIANLIMA_BROWSER_MODE: ${BIDPILOT_QIANLIMA_BROWSER_MODE:-auto}
  BIDPILOT_LLM_BASE_URL: ${BIDPILOT_LLM_BASE_URL:-}
  BIDPILOT_LLM_API_KEY: ${BIDPILOT_LLM_API_KEY:-}
  BIDPILOT_LLM_MODEL: ${BIDPILOT_LLM_MODEL:-}
  BIDPILOT_LLM_TIMEOUT: ${BIDPILOT_LLM_TIMEOUT:-30}
  BIDPILOT_INTENT_LLM_MODE: ${BIDPILOT_INTENT_LLM_MODE:-auto}
  BIDPILOT_INTENT_LLM_CONFIDENCE_THRESHOLD: ${BIDPILOT_INTENT_LLM_CONFIDENCE_THRESHOLD:-0.85}
  BIDPILOT_RETRIEVAL_LLM_MODE: ${BIDPILOT_RETRIEVAL_LLM_MODE:-auto}
  BIDPILOT_RETRIEVAL_MAX_ROUNDS: ${BIDPILOT_RETRIEVAL_MAX_ROUNDS:-2}
  BIDPILOT_RETRIEVAL_QUERY_BUDGET_PER_SOURCE: ${BIDPILOT_RETRIEVAL_QUERY_BUDGET_PER_SOURCE:-2}
  BIDPILOT_RETRIEVAL_SEMANTIC_REVIEW: ${BIDPILOT_RETRIEVAL_SEMANTIC_REVIEW:-true}
  BIDPILOT_RETRIEVAL_SEMANTIC_THRESHOLD: ${BIDPILOT_RETRIEVAL_SEMANTIC_THRESHOLD:-0.82}
  BIDPILOT_RETRIEVAL_SEMANTIC_CANDIDATE_LIMIT: ${BIDPILOT_RETRIEVAL_SEMANTIC_CANDIDATE_LIMIT:-12}
  BIDPILOT_INTELLIGENCE_BRIEF_MODE: ${BIDPILOT_INTELLIGENCE_BRIEF_MODE:-auto}
  BIDPILOT_INTELLIGENCE_BRIEF_MAX_RECORDS: ${BIDPILOT_INTELLIGENCE_BRIEF_MAX_RECORDS:-12}
  BIDPILOT_DECISION_ASSESSMENT_MODE: ${BIDPILOT_DECISION_ASSESSMENT_MODE:-auto}
  BIDPILOT_DECISION_ASSESSMENT_MAX_RECORDS: ${BIDPILOT_DECISION_ASSESSMENT_MAX_RECORDS:-15}
  BIDPILOT_FEISHU_WEBHOOK_URL: ${BIDPILOT_FEISHU_WEBHOOK_URL:-}
  BIDPILOT_FEISHU_WEBHOOK_SECRET: ${BIDPILOT_FEISHU_WEBHOOK_SECRET:-}
  BIDPILOT_FEISHU_APP_ID: ${BIDPILOT_FEISHU_APP_ID:-}
  BIDPILOT_FEISHU_APP_SECRET: ${BIDPILOT_FEISHU_APP_SECRET:-}
  BIDPILOT_FEISHU_RECEIVE_ID: ${BIDPILOT_FEISHU_RECEIVE_ID:-}
  BIDPILOT_FEISHU_RECEIVE_ID_TYPE: ${BIDPILOT_FEISHU_RECEIVE_ID_TYPE:-chat_id}
  BIDPILOT_PUBLIC_BASE_URL: ${BIDPILOT_PUBLIC_BASE_URL:-}
  BIDPILOT_SMTP_HOST: ${BIDPILOT_SMTP_HOST:-}
  BIDPILOT_SMTP_PORT: ${BIDPILOT_SMTP_PORT:-465}
  BIDPILOT_SMTP_SECURITY: ${BIDPILOT_SMTP_SECURITY:-ssl}
  BIDPILOT_SMTP_USERNAME: ${BIDPILOT_SMTP_USERNAME:-}
  BIDPILOT_SMTP_PASSWORD: ${BIDPILOT_SMTP_PASSWORD:-}
  BIDPILOT_SMTP_FROM: ${BIDPILOT_SMTP_FROM:-}
  BIDPILOT_SMTP_TO: ${BIDPILOT_SMTP_TO:-}
  BIDPILOT_SMTP_TIMEOUT: ${BIDPILOT_SMTP_TIMEOUT:-30}
  BIDPILOT_DINGTALK_WEBHOOK_URL: ${BIDPILOT_DINGTALK_WEBHOOK_URL:-}
  BIDPILOT_DINGTALK_WEBHOOK_SECRET: ${BIDPILOT_DINGTALK_WEBHOOK_SECRET:-}
  BIDPILOT_WECOM_WEBHOOK_URL: ${BIDPILOT_WECOM_WEBHOOK_URL:-}
  BIDPILOT_GENERIC_WEBHOOK_URL: ${BIDPILOT_GENERIC_WEBHOOK_URL:-}
  BIDPILOT_GENERIC_WEBHOOK_BEARER_TOKEN: ${BIDPILOT_GENERIC_WEBHOOK_BEARER_TOKEN:-}
  BIDPILOT_TELEGRAM_BOT_TOKEN: ${BIDPILOT_TELEGRAM_BOT_TOKEN:-}
  BIDPILOT_TELEGRAM_CHAT_ID: ${BIDPILOT_TELEGRAM_CHAT_ID:-}
  BIDPILOT_TELEGRAM_MESSAGE_THREAD_ID: ${BIDPILOT_TELEGRAM_MESSAGE_THREAD_ID:-}
  BIDPILOT_TELEGRAM_DISABLE_NOTIFICATION: ${BIDPILOT_TELEGRAM_DISABLE_NOTIFICATION:-false}
  BIDPILOT_TELEGRAM_PROTECT_CONTENT: ${BIDPILOT_TELEGRAM_PROTECT_CONTENT:-false}
  BIDPILOT_SLACK_WEBHOOK_URL: ${BIDPILOT_SLACK_WEBHOOK_URL:-}
  BIDPILOT_DELIVERY_WEBHOOK_TIMEOUT: ${BIDPILOT_DELIVERY_WEBHOOK_TIMEOUT:-20}

services:
  web:
    build: .
    init: true
    restart: unless-stopped
    environment:
      <<: *bidpilot-environment
      BIDPILOT_EMBEDDED_WORKER: "false"
      BIDPILOT_HOST: 0.0.0.0
      # Docker bridge traffic is not loopback inside the container. The port is
      # still published only on host 127.0.0.1, while this policy lets that host
      # browser perform normal POST/PUT/PATCH/DELETE operations.
      BIDPILOT_NETWORK_ACCESS_MODE: lan
      BIDPILOT_LAN_ACCESS_POLICY: trusted_lan
      BIDPILOT_LAN_TRUSTED_NETWORKS: auto
    ports:
      - "127.0.0.1:${BIDPILOT_PORT:-8000}:8000"
    volumes:
      - bidpilot-data:/app/data
      - bidpilot-reports:/app/outputs/reports
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    stop_grace_period: 30s

  worker:
    build: .
    init: true
    restart: unless-stopped
    command: ["python", "-m", "bidpilot", "worker"]
    environment:
      <<: *bidpilot-environment
      BIDPILOT_EMBEDDED_WORKER: "false"
    volumes:
      - bidpilot-data:/app/data
      - bidpilot-reports:/app/outputs/reports
    depends_on:
      web:
        condition: service_healthy
    stop_grace_period: 30s

volumes:
  bidpilot-data:
  bidpilot-reports:
