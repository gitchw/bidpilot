[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bidpilot"
version = "0.2.0"
description = "Evidence-first tender intelligence agent for the 2026 AI Future Talent competition"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "聚标成擎"}]
dependencies = [
  "beautifulsoup4>=4.13.0",
  "dateparser>=1.2.1",
  "fastapi>=0.116.0",
  "httpx>=0.28.1",
  "lxml>=5.3.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.0",
  "python-docx>=1.2.0",
  "python-multipart>=0.0.20",
  "rapidfuzz>=3.13.0",
  "rich>=14.0.0",
  "tzdata>=2025.2",
  "typer>=0.16.0",
  "uvicorn[standard]>=0.35.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
  "pytest-asyncio>=1.0.0",
  "pytest-cov>=6.2.0",
  "ruff>=0.12.0"
]
auth = ["playwright>=1.53.0"]

[project.scripts]
bidpilot = "bidpilot.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["bidpilot"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
